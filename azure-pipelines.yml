trigger:
  branches:
    include:
      - main
      - develop

variables:
  dotnetConfiguration: Release
  backendProject: backend/OpenPawDevs.WebAPI/OpenPawDevs.WebAPI.csproj
  backendTestProject: backend/tests/OpenPawDevs.Tests/OpenPawDevs.Tests.csproj
  frontendPath: frontend
  ftpServer: ftp-openpaw.alwaysdata.net
  ftpUser: openpaw
  vercelOrgId: team_abkgXAOuTcvzFFPvUimTsTra
  vercelProjectId: prj_rl1UlWeHbY9ZAtJ0r38tCu2OQxjb

stages:
  - stage: Build
    displayName: Build
    jobs:
      - job: BuildBackend
        displayName: Build Backend
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: UseDotNet@2
            displayName: Install .NET SDK
            inputs:
              packageType: sdk
              version: 10.x
          - task: DotNetCoreCLI@2
            displayName: Restore packages
            inputs:
              command: restore
              projects: $(backendProject)
          - task: DotNetCoreCLI@2
            displayName: Build
            inputs:
              projects: $(backendProject)
              arguments: --configuration $(dotnetConfiguration) --no-restore
          - task: DotNetCoreCLI@2
            displayName: Run tests
            inputs:
              command: test
              projects: $(backendTestProject)
              arguments: --configuration $(dotnetConfiguration)
          - task: DotNetCoreCLI@2
            displayName: Publish (self-contained)
            inputs:
              command: publish
              publishWebProjects: false
              projects: $(backendProject)
              arguments: --configuration $(dotnetConfiguration) --runtime linux-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output $(Build.ArtifactStagingDirectory)/backend
              zipAfterPublish: false
          - publish: $(Build.ArtifactStagingDirectory)/backend
            artifact: backend-drop

      - job: BuildFrontend
        displayName: Build Frontend
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: NodeTool@0
            displayName: Install Node.js
            inputs:
              versionSpec: 20.x
          - script: npm ci
            displayName: Install dependencies
            workingDirectory: $(frontendPath)
          - script: npm run build
            displayName: Build
            workingDirectory: $(frontendPath)
            env:
              VITE_API_BASE_URL: https://openpaw.alwaysdata.net/api
          - task: CopyFiles@2
            displayName: Copy build output
            inputs:
              SourceFolder: $(frontendPath)/dist
              Contents: "**"
              TargetFolder: $(Build.ArtifactStagingDirectory)/frontend
              CleanTargetFolder: true
          - publish: $(Build.ArtifactStagingDirectory)/frontend
            artifact: frontend-drop

  - stage: Deploy
    displayName: Deploy
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: DeployBackend
        displayName: Deploy Backend (Alwaysdata)
        pool:
          vmImage: ubuntu-latest
        steps:
          - download: current
            artifact: backend-drop
          - script: |
              set -e
              cd $(Pipeline.Workspace)/backend-drop
              echo "Uploading backend to Alwaysdata..."
              curl --ssl -u "$(ftpUser):$(ALWAYSDATA_FTP_PASS)" \
                --ftp-create-dirs \
                -T ./OpenPawDevs.WebAPI \
                ftp://$(ftpServer)/www/api/OpenPawDevs.WebAPI
              curl --ssl -u "$(ftpUser):$(ALWAYSDATA_FTP_PASS)" \
                -T ./appsettings.json \
                ftp://$(ftpServer)/www/api/appsettings.json
              curl --ssl -u "$(ftpUser):$(ALWAYSDATA_FTP_PASS)" \
                -T ./appsettings.Production.json \
                ftp://$(ftpServer)/www/api/appsettings.Production.json
              echo "Backend deploy complete."
            displayName: Upload backend via FTP

      - job: DeployFrontend
        displayName: Deploy Frontend (Vercel)
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self
          - task: NodeTool@0
            displayName: Install Node.js
            inputs:
              versionSpec: 20.x
          - script: |
              set -e
              cd $(frontendPath)
              echo "Pulling Vercel project settings..."
              npx vercel pull --yes --environment=production --token=$(VERCEL_TOKEN)
              echo "Building for production..."
              npx vercel build --prod --token=$(VERCEL_TOKEN)
              echo "Deploying to Vercel production..."
              npx vercel deploy --prebuilt --prod --token=$(VERCEL_TOKEN)
              echo "Frontend deploy complete."
            displayName: Deploy frontend via Vercel CLI
            env:
              VERCEL_ORG_ID: $(vercelOrgId)
              VERCEL_PROJECT_ID: $(vercelProjectId)
